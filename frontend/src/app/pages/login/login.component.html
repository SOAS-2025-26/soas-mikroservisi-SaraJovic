<div class="login-wrapper">
  <div class="login-card">
    <div class="login-header">
      <div class="logo-icon">💱</div>
      <h1>Welcome back</h1>
      <p>Sign in to your account</p>
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" [(ngModel)]="email" placeholder="Enter your email" />
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" [(ngModel)]="password" placeholder="Enter your password" />
    </div>
    <button class="login-btn" type="button" (click)="login()" [disabled]="loading">
      {{ loading ? 'Signing in...' : 'Login' }}
    </button>
    <div class="error" *ngIf="error">{{ error }}</div>
    <div class="back-link">
      <a routerLink="/exchange-rates">← Back to Exchange Rates</a>
    </div>
  </div>
</div>
