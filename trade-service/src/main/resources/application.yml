server:
  port: 8600

spring:
  application:
    name: trade-service
  datasource:
    url: jdbc:h2:mem:tradeservicedb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
